<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Flow Media</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#101416;color:#eff4f1}main{max-width:54rem;margin:6vh auto;padding:1rem}h1{font-size:clamp(2rem,6vw,4rem);margin:0 0 1rem}label,button,input{margin:.4rem}section{position:relative;background:#030505;aspect-ratio:16/9;margin:1rem 0}video{position:absolute;width:100%;height:100%;object-fit:contain}#high{visibility:hidden;pointer-events:none}button{padding:.5rem 1rem}input[type=range]{width:50%}output{display:block;color:#9ee8c3}
</style>
<main><h1>Auto Flow Media</h1>
<label>Open a local file <input id="file" type="file" accept=".afm"></label>
<section><video id="local" playsinline></video><video id="high" muted playsinline></video></section>
<button id="play">Play</button><label>Seek <input id="seek" type="range" min="0" max="1000" value="0"></label>
<label><input id="cloud" type="checkbox">Enable remote playback for this file</label>
<p id="origin"></p><output id="status" aria-live="polite">Choose an AFM file.</output></main>
<script type="module" src="./player.js"></script></html>
