<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Workspace · Auto Flow Media</title>
<style>
:root{font:16px/1.55 "Segoe UI",system-ui,sans-serif;color:#182e30;background:#eef2ed}*{box-sizing:border-box}body{margin:0}header{background:#133936;color:white;padding:1rem max(5vw,1rem);display:flex;align-items:center;justify-content:space-between}header strong{letter-spacing:.06em}main{width:min(1000px,92vw);margin:3rem auto}h1{font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.055em;margin:0}h2{font-size:1.2rem;margin:0 0 1rem}.grid{display:grid;grid-template-columns:3fr 2fr;gap:1rem}article{background:white;padding:1.4rem;border:1px solid #cdd9d2;border-radius:10px;margin:1rem 0}button,a,input,select,textarea{font:inherit}button,a{cursor:pointer}button{border:0;background:#246255;color:white;padding:.45rem .85rem;border-radius:5px}input,select,textarea{padding:.45rem .6rem;border:1px solid #b8c9c0;border-radius:4px;max-width:100%}form{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.row{padding:.6rem 0;border-top:1px solid #dce5df;display:flex;gap:.8rem;align-items:center;justify-content:space-between;overflow-wrap:anywhere}.row small{color:#47615c}output{white-space:pre-wrap;overflow-wrap:anywhere;color:#74401b}header a{color:#c4f0db}#login{max-width:32rem}textarea{width:100%}label{display:grid;font-size:.9rem}#workspace>p{margin-top:0}@media(max-width:700px){.grid{display:block}}[hidden]{display:none!important}
</style></head><body><header><strong>Auto Flow Media</strong><a href="/player">Open player ↗</a></header><main>
<article id="login"><h1>Team sign in</h1><form id="signin"><label>Personal access key<input name="key" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></article>
<section id="workspace" hidden><h1 id="title"></h1><p id="identity"></p><button id="refresh">Refresh</button> <button id="logout">Sign out</button>
<div class="grid"><div><article><h2>Media library</h2><div id="assets"></div></article><article><h2>Review notes</h2><form id="comment"><label>Asset<select name="asset" required></select></label><textarea name="text" maxlength="2000" required aria-label="Review note"></textarea><button>Add note</button></form><div id="notes"></div></article></div>
<article><h2>Team members</h2><div id="members"></div><form id="invite"><label>Member name<input name="name" required maxlength="128"></label><label>Role<select name="role"><option>viewer</option><option>editor</option><option>admin</option></select></label><button>Create access key</button></form><output id="key"></output></article></div></section><output role="status" id="message"></output></main><script type="module" src="/team.js"></script></body></html>
