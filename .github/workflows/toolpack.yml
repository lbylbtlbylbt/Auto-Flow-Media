name: Test released toolpack
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag and ZIP basename
        required: true
        type: string
      sha256:
        description: Expected SHA-256 of the uploaded ZIP
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Download and verify the distribution
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ inputs.sha256 }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$TAG.zip"
          python -c 'import hashlib,os,zipfile,pathlib; p=pathlib.Path(os.environ["TAG"]+".zip"); assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ["DIGEST"]; zipfile.ZipFile(p).extractall("dist")'
      - name: Install media tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if command -v ffmpeg && command -v ffprobe; then exit 0; fi
          case "$RUNNER_OS" in
            Linux)
              archive=ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
              digest=$(gh release view latest --repo BtbN/FFmpeg-Builds --json assets --jq ".assets[] | select(.name == \"$archive\") | .digest")
              gh release download latest --repo BtbN/FFmpeg-Builds --pattern "$archive"
              echo "${digest#sha256:}  $archive" | sha256sum --check
              mkdir "$RUNNER_TEMP/afm-ffmpeg"
              tar -xf "$archive" -C "$RUNNER_TEMP/afm-ffmpeg" --strip-components=1
              echo "$RUNNER_TEMP/afm-ffmpeg/bin" >> "$GITHUB_PATH"
              ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
      - name: Exercise the shipped sample and HTTPS workspace
        working-directory: dist/${{ inputs.tag }}
        env:
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          node --version
          ffmpeg -version
          node afm.mjs inspect demo/example.afm
          node afm.mjs extract demo/example.afm restored.mp4
          cmp restored.mp4 demo/proxy.mp4
          ffmpeg -v error -i restored.mp4 -f null -
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -addext subjectAltName=IP:127.0.0.1 -keyout test-key.pem -out test-cert.pem
          export AFM_TEST_CERT="$(node -p "require('path').resolve('test-cert.pem')")"
          export AFM_TEST_KEY="$(node -p "require('path').resolve('test-key.pem')")"
          node --test test.mjs team.test.mjs
